# MakerPrint E3NG macros: printing, filament, pause/resume and print modes.
#
# Slicer start G-code (PrusaSlicer / OrcaSlicer / SuperSlicer):
#   START_PRINT BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature] MATERIAL=[filament_type]
# Cura:
#   START_PRINT BED={material_bed_temperature_layer_0} EXTRUDER={material_print_temperature_layer_0} MATERIAL={material_type}
# Slicer end G-code:
#   END_PRINT
# Turn on "Label objects" in the slicer so adaptive meshing, adaptive purge and cancel object work.

[gcode_macro _MP]
# Shared settings, in one place. Change them here (or with SET_GCODE_VARIABLE).
variable_park_x: 220            # where PAUSE / M600 / END_PRINT park the head (nozzle coords)
variable_park_y: 230
variable_park_lift: 10          # mm Z lift when parking
variable_retract: 1.0           # mm pulled back on pause and at the end of a print
variable_load_length: 100       # nozzle to gears + melt zone, for LOAD / UNLOAD
variable_load_speed: 300        # mm/min while loading
variable_purge_length: 30       # mm extruded by LOAD_FILAMENT after the filament arrives
variable_probe_temp: 150        # nozzle warm, not oozing, while probing
variable_purge_y: 4             # where the purge line goes when there is no object info
# Pressure advance per material (Volcano). PA_CALIBRATE finds the real numbers for yours.
variable_pa: {"PLA": 0.060, "PETG": 0.090, "ABS": 0.070, "ASA": 0.070, "TPU": 0.200, "DEFAULT": 0.060}
gcode:
  RESPOND MSG="_MP holds shared macro settings."

[gcode_macro _LED]
description: Stealthburner status colour, if leds.cfg is included (otherwise does nothing)
gcode:
  {% set state = params.STATE|default("READY")|upper %}
  {% if 'neopixel sb_leds' in printer and ('gcode_macro STATUS_' ~ state) in printer %}
    STATUS_{state}
  {% endif %}

#####################################################################
#  Print start and end
#####################################################################

[gcode_macro START_PRINT]
description: Heat, home, mesh where the print goes, purge, print
gcode:
  {% set bed = params.BED|default(60)|float %}
  {% set hotend = params.EXTRUDER|default(params.HOTEND|default(210))|float %}
  {% set material = params.MATERIAL|default("PLA")|string|upper %}
  {% set mp = printer["gcode_macro _MP"] %}
  {% set pa = mp.pa[material] if material in mp.pa else mp.pa["DEFAULT"] %}

  {% if printer.configfile.settings.bltouch.z_offset == 0 and not params.FORCE %}
    { action_raise_error("The probe's Z offset hasn't been calibrated yet. Run PROBE_Z_OFFSET (Tune page or CALIBRATION_WIZARD), then SAVE_CONFIG.") }
  {% endif %}
  CLEAR_PAUSE
  M220 S100                                   ; speed and flow back to 100%
  M221 S100
  G90
  M83                                         ; relative extrusion (what the slicers send)
  SET_GCODE_OFFSET Z=0                        ; the probe's z_offset is the baseline, not a leftover babystep
  _LED STATE=HEATING
  RESPOND TYPE=command MSG="action:notification Heating bed to {bed|int}°"
  M140 S{bed}
  M104 S{mp.probe_temp}                       ; warm the nozzle without oozing on the probe points
  G28
  M190 S{bed}
  _LED STATE=PROBING
  RESPOND TYPE=command MSG="action:notification Probing the print area"
  BED_MESH_CLEAR
  # Adaptive mesh needs the slicer's object outlines. Marlin-style labels (M486) have none,
  # and Klipper's adaptive mesh stops the printer on an object without one: mesh it all then.
  {% set objs = printer.exclude_object.objects %}
  {% if objs|length > 0 and objs|selectattr("polygon", "defined")|list|length == objs|length %}
    BED_MESH_CALIBRATE ADAPTIVE=1
  {% else %}
    BED_MESH_CALIBRATE
  {% endif %}
  G1 Z10 F600
  RESPOND TYPE=command MSG="action:notification Heating nozzle to {hotend|int}°"
  M109 S{hotend}
  SET_PRESSURE_ADVANCE ADVANCE={pa}
  _LED STATE=HEATING
  PURGE_LINE
  _LED STATE=PRINTING
  RESPOND TYPE=command MSG="action:notification Printing"

[gcode_macro END_PRINT]
description: Retract, park, everything off
gcode:
  {% set mp = printer["gcode_macro _MP"] %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set z = [printer.toolhead.position.z + mp.park_lift, max_z]|min %}
  M400
  G92 E0
  G1 E-{mp.retract} F2700
  G91
  G1 Z2 F3000                                 ; off the print before moving
  G90
  G1 Z{z} F1200
  G1 X{mp.park_x} Y{mp.park_y} F12000         ; present the print
  TURN_OFF_HEATERS
  M107
  M84 X Y E                                   ; Z stays locked so the bed doesn't drop
  BED_MESH_CLEAR
  _RESTORE_SPEED_LIMITS
  _LED STATE=READY
  # OctoPrint streams files, so Klipper never sees a file end: forget this print's objects
  # here or the next print's adaptive mesh and purge would include them
  EXCLUDE_OBJECT_DEFINE RESET=1

[gcode_macro PURGE_LINE]
description: A purge line beside the print (or along the front if the slicer didn't label objects)
gcode:
  {% set mp = printer["gcode_macro _MP"] %}
  {% set xs = [] %}{% set ys = [] %}
  {% for o in printer.exclude_object.objects %}{% for p in o.polygon|default([]) %}
    {% set _ = xs.append(p[0]) %}{% set _ = ys.append(p[1]) %}
  {% endfor %}{% endfor %}
  {% if xs|length > 0 %}
    {% set x0 = [xs|min, 10]|max %}
    {% set y0 = [ys|min - 6, 2]|max %}
    {% set x1 = [x0 + 60, printer.toolhead.axis_maximum.x - 5]|min %}
  {% else %}
    {% set x0 = 10 %}{% set y0 = mp.purge_y %}{% set x1 = 120 %}
  {% endif %}
  G90
  G1 X{x0} Y{y0} Z5 F12000
  G1 Z0.3 F600
  G92 E0
  G1 X{x1} E{(x1 - x0) * 0.12} F1500          ; thick line: primes the Volcano's big melt zone
  G1 X{x1 + 10} E0.2 F3000                    ; wipe
  G92 E0
  G1 Z2 F1200

#####################################################################
#  Pause, resume, cancel (OctoPrint and the UI both use these)
#####################################################################

[gcode_macro PAUSE]
description: Pause, retract and park
rename_existing: BASE_PAUSE
gcode:
  {% set mp = printer["gcode_macro _MP"] %}
  {% if printer.pause_resume.is_paused %}
    RESPOND MSG="Already paused"
  {% else %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set z = [printer.toolhead.position.z + mp.park_lift, max_z]|min %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=temp VALUE={printer.extruder.target}
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    BASE_PAUSE
    G91
    G1 E-{mp.retract} F2700
    G90
    G1 Z{z} F1200
    G1 X{mp.park_x} Y{mp.park_y} F12000
  {% endif %}

[gcode_macro RESUME]
description: Reheat if needed, return to the print and carry on
rename_existing: BASE_RESUME
variable_temp: 0
gcode:
  {% set mp = printer["gcode_macro _MP"] %}
  {% if not printer.pause_resume.is_paused %}
    RESPOND MSG="Not paused"
  {% else %}
    {% if temp > 0 and printer.extruder.target < temp %}
      M109 S{temp}                              ; idle timeout turned the nozzle off
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_end"
    G91
    G1 E{mp.retract} F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=200
    BASE_RESUME
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Stop the print and park
rename_existing: BASE_CANCEL_PRINT
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  CLEAR_PAUSE
  END_PRINT
  BASE_CANCEL_PRINT

[gcode_macro M600]
description: Filament change: pause, park, unload, and ask for the new filament
gcode:
  PAUSE
  UNLOAD_FILAMENT
  RESPOND TYPE=command MSG="action:prompt_begin Filament change"
  RESPOND TYPE=command MSG="action:prompt_text The old filament is out. Put the new filament in the extruder, then press Load."
  RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
  RESPOND TYPE=command MSG="action:prompt_button Purge more|PURGE_MORE|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel print|CANCEL_PRINT|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Resume|RESUME|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

#####################################################################
#  Filament
#####################################################################

[gcode_macro LOAD_FILAMENT]
description: Feed filament into the hot nozzle and purge
gcode:
  {% set mp = printer["gcode_macro _MP"] %}
  {% set target = params.TEMP|default(0)|float %}
  {% if target > 0 %}
    M109 S{target}
  {% elif printer.extruder.temperature < printer.configfile.settings.extruder.min_extrude_temp %}
    RESPOND TYPE=error MSG="Heat the nozzle first (or LOAD_FILAMENT TEMP=220)."
  {% endif %}
  {% if target > 0 or printer.extruder.temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
    SAVE_GCODE_STATE NAME=LOAD_STATE
    M83
    G1 E{mp.load_length * 0.8} F{mp.load_speed}
    G1 E{mp.load_length * 0.2 + mp.purge_length} F150
    G1 E-{mp.retract} F1800
    RESTORE_GCODE_STATE NAME=LOAD_STATE
    RESPOND MSG="Filament loaded"
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Tip-form and pull the filament out of the hot nozzle
gcode:
  {% set mp = printer["gcode_macro _MP"] %}
  {% set target = params.TEMP|default(0)|float %}
  {% if target > 0 %}
    M109 S{target}
  {% endif %}
  {% if printer.extruder.temperature < printer.configfile.settings.extruder.min_extrude_temp %}
    RESPOND TYPE=error MSG="Heat the nozzle first (or UNLOAD_FILAMENT TEMP=220)."
  {% else %}
    SAVE_GCODE_STATE NAME=UNLOAD_STATE
    M83
    G1 E5 F300                                  ; soften the tip
    G1 E-15 F3000                               ; snap it out of the melt zone
    G4 P2000
    G1 E-{mp.load_length} F{mp.load_speed * 4}
    RESTORE_GCODE_STATE NAME=UNLOAD_STATE
    RESPOND MSG="Filament unloaded"
  {% endif %}

[gcode_macro PURGE_MORE]
description: Push another 20 mm through (during a filament change)
gcode:
  M83
  G1 E20 F150

#####################################################################
#  Moving around
#####################################################################

[gcode_macro PARK]
description: Lift and park the head at the back right
gcode:
  {% set mp = printer["gcode_macro _MP"] %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set z = [printer.toolhead.position.z + mp.park_lift, printer.toolhead.axis_maximum.z]|min %}
  G90
  G1 Z{z} F1200
  G1 X{mp.park_x} Y{mp.park_y} F12000

[gcode_macro CENTER]
description: Move the nozzle to the middle of the bed
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 Z10 F1200
  G1 X117.5 Y117.5 F12000

[gcode_macro G29]
description: Home and make a full bed mesh (for slicers that send G29)
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  BED_MESH_CALIBRATE

[gcode_macro CLEAN_NOZZLE]
description: No brush on this machine: a short purge and wipe at the front edge instead
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% if printer.extruder.temperature < printer.configfile.settings.extruder.min_extrude_temp %}
    RESPOND TYPE=error MSG="Heat the nozzle first."
  {% else %}
    PURGE_LINE
  {% endif %}

#####################################################################
#  Print modes: quiet, normal, fast
#####################################################################

[gcode_macro PRINT_MODE]
description: MODE=quiet|normal|fast. Quiet caps speed and acceleration for night printing.
variable_mode: "normal"
gcode:
  {% set m = params.MODE|default("normal")|lower %}
  {% if m == "quiet" %}
    SET_VELOCITY_LIMIT VELOCITY=150 ACCEL=2500 MINIMUM_CRUISE_RATIO=0.5 SQUARE_CORNER_VELOCITY=4
    M220 S80
  {% elif m == "fast" %}
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO=0.4 SQUARE_CORNER_VELOCITY=6
    M220 S100
  {% else %}
    {% set m = "normal" %}
    _RESTORE_SPEED_LIMITS
    M220 S100
  {% endif %}
  SET_GCODE_VARIABLE MACRO=PRINT_MODE VARIABLE=mode VALUE='"{m}"'
  RESPOND MSG="Print mode: {m}"

[gcode_macro _RESTORE_SPEED_LIMITS]
gcode:
  {% set p = printer.configfile.settings.printer %}
  SET_VELOCITY_LIMIT VELOCITY={p.max_velocity} ACCEL={p.max_accel} MINIMUM_CRUISE_RATIO={p.minimum_cruise_ratio} SQUARE_CORNER_VELOCITY={p.square_corner_velocity}

#####################################################################
#  Small things slicers and OctoPrint send
#####################################################################

[gcode_macro M486]
description: Marlin-style object cancel, mapped to Klipper's EXCLUDE_OBJECT
gcode:
  {% if 'exclude_object' in printer %}
    {% if 'T' in params %}
      EXCLUDE_OBJECT RESET=1
      {% for i in range(params.T|int) %}
        EXCLUDE_OBJECT_DEFINE NAME={i}
      {% endfor %}
    {% endif %}
    {% if 'C' in params %}
      EXCLUDE_OBJECT_END
    {% endif %}
    {% if 'P' in params %}
      EXCLUDE_OBJECT NAME={params.P|int}
    {% endif %}
    {% if 'S' in params %}
      {% if params.S|int == -1 %}
        {% if printer.exclude_object.current_object %}
          EXCLUDE_OBJECT_END NAME={printer.exclude_object.current_object}
        {% endif %}
      {% else %}
        EXCLUDE_OBJECT_START NAME={params.S|int}
      {% endif %}
    {% endif %}
    {% if 'U' in params %}
      EXCLUDE_OBJECT RESET=1 NAME={params.U|int}
    {% endif %}
  {% endif %}

[gcode_macro M900]
description: Linear advance (Marlin) to pressure advance (K value)
gcode:
  {% if 'K' in params %}
    SET_PRESSURE_ADVANCE ADVANCE={params.K}
  {% endif %}

[gcode_macro M117]
description: Show a message (also forwarded to OctoPrint)
rename_existing: M117.1
gcode:
  {% if rawparams %}
    M117.1 {rawparams}
    RESPOND TYPE=command MSG="action:notification {rawparams}"
  {% else %}
    M117.1
  {% endif %}
