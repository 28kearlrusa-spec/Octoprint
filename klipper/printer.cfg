# MakerPrint E3NG: Ender 3 NG (CoreXY) on the stock Creality 4.2.2 "silent" board
#
#   Board:    Creality v4.2.2 (STM32F103RET6 or GD32F303RET6), TMC2208 drivers in standalone
#             (always stealthChop: quiet, no UART, so no driver tuning from Klipper)
#   Probe:    BLTouch on the board's 5-pin BLTouch port
#   Hotend:   Volcano block, stock 24 V heater and stock thermistor
#   Toolhead: Voron Stealthburner shroud for Ender printers, stock fans inside
#   Bed:      stock heater, Biqu CryoGrip build plate
#   Host:     Raspberry Pi with OctoPrint + OctoKlipper, ADXL345 on the Pi's SPI pins
#
# Firmware: klipper/firmware/klipper.bin (see klipper/README.md for how to flash it).
#
# Lines marked  >>> CHECK  are things only your printer can tell us. klipper/README.md walks
# through each one in order. Nothing else should need touching.

[include macros.cfg]
[include calibration.cfg]
[include adxl.cfg]

#####################################################################
#  Board
#####################################################################

[mcu]
# >>> CHECK: run  ls /dev/serial/by-id/  on the Pi with the printer plugged in and paste the
# path here. This is the usual one for the Ender 3 V2's CH340 USB chip.
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[temperature_sensor mainboard]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

#####################################################################
#  Motion: CoreXY
#####################################################################

[printer]
kinematics: corexy
# Standalone TMC2208s in stealthChop lose torque fast above ~250 mm/s, and a skipped step on
# CoreXY ruins the print. These limits are what the stock motors hold reliably after input
# shaping. Run SPEED_TEST (calibration.cfg) to find your machine's real ceiling and raise them.
max_velocity: 300
max_accel: 6000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 10
max_z_accel: 100

# stepper_x / stepper_y are CoreXY's A and B motors, on the board's X and Y driver sockets.
[stepper_x]
step_pin: PC2
dir_pin: PB9            # >>> CHECK: direction (see README "Motor directions")
enable_pin: !PC3
microsteps: 16          # the 2208s interpolate to 256 on their own; 16 is what the board wires
rotation_distance: 40   # GT2 belt, 20-tooth pulley
# X endstop: the D2F-L microswitch on the carriage, wired COM + NC (normally closed), so the
# pin reads high when pressed. Plug it into the board's X socket.
endstop_pin: ^PA5
position_endstop: 229   # homes to the right (max) side
position_min: -4
position_max: 229
homing_speed: 40
second_homing_speed: 10
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
step_pin: PB8
dir_pin: PB7            # >>> CHECK: direction
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
# Y endstop: on the back XY joint, pressed against the rear frame. Board's Y socket.
endstop_pin: ^PA6
position_endstop: 239   # homes to the back (max) side
position_min: -9
position_max: 239
homing_speed: 40
second_homing_speed: 10
homing_retract_dist: 5
homing_positive_dir: true

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
# Three T8 lead screws tied together by one closed belt, driven by this single motor, so the
# bed stays level by itself (no Z_TILT needed; level it once by hand with BED_SCREWS).
rotation_distance: 8
# >>> CHECK: the E3NG's lead screw pulleys (42T) against the motor pulley (20T). If your
# pulleys are the same size as the motor's, delete this line. Z_CHECK tells you: 20 mm asked,
# ~9.5 mm moved means delete it.
gear_ratio: 42:20
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 245
homing_speed: 8
second_homing_speed: 3

#####################################################################
#  Toolhead: Volcano on the stock heater, Stealthburner shroud
#####################################################################

[extruder]
step_pin: PB4
dir_pin: PB3            # >>> CHECK: if filament goes backwards, change to !PB3
enable_pin: !PC3
microsteps: 16
# >>> CHECK: 34.406 is the stock Ender 3 V2 extruder. Run EXTRUDER_CALIBRATE to fine tune.
# (A Clockwork 2 / Stealthburner extruder would be rotation_distance 22.6789511 with
# gear_ratio 50:10 instead.)
rotation_distance: 34.406
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F   # the stock Ender 3 V2 thermistor
sensor_pin: PC5
# Starting values for a Volcano block on the stock 40 W heater. PID_HOTEND replaces them.
control: pid
pid_Kp: 24.000
pid_Ki: 1.400
pid_Kd: 103.000
min_temp: 0
# The stock hotend has a PTFE liner, which gives off fumes above ~240 C, so 250 is the hard
# limit and the material presets stay at or below 240. With an all-metal heat break you can
# raise this to 285.
max_temp: 250
min_extrude_temp: 170
max_extrude_only_distance: 120   # long enough for LOAD_FILAMENT / UNLOAD_FILAMENT
max_extrude_cross_section: 5     # lets the purge line run thick
# Volcano melt zone: a Volcano needs more pressure advance than a stock heat block.
# PA_CALIBRATE finds yours. 0.06 is a typical Volcano + Bowden-free starting point.
pressure_advance: 0.06
pressure_advance_smooth_time: 0.040

[verify_heater extruder]
# The Volcano block has more thermal mass than stock, so give it a little longer to climb.
max_error: 120
check_gain_time: 30
hysteresis: 5
heating_gain: 2

[fan]
pin: PA0                # Stealthburner part cooling blower(s)
kick_start_time: 0.5
off_below: 0.10
# The stock hotend fan runs from 24 V whenever the printer is on, so it needs no config.

[firmware_retraction]
# For slicers set to "use firmware retraction". Short, because the extruder is direct drive.
retract_length: 0.6
retract_speed: 45
unretract_extra_length: 0
unretract_speed: 35

#####################################################################
#  Bed
#####################################################################

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 110

#####################################################################
#  BLTouch
#####################################################################

[bltouch]
sensor_pin: ^PB1
control_pin: PB0
# >>> CHECK: where the probe pin sits relative to the nozzle (README "Probe offsets").
# These are the E3NG Stealthburner mount's numbers.
x_offset: 0
y_offset: -18
# The real z_offset comes from PROBE_Z_OFFSET (the paper test), and SAVE_CONFIG writes it at
# the bottom of this file. The Volcano is longer than stock, so don't copy one from another
# printer. START_PRINT refuses to print while this is still 0.
z_offset: 0
speed: 5
lift_speed: 15
samples: 2
sample_retract_dist: 3
samples_result: median
samples_tolerance: 0.01
samples_tolerance_retries: 3
# Probing a clone? Set this to False if PROBE_ACCURACY shows a range above 0.02 mm.
probe_with_touch_mode: True
stow_on_each_sample: False

[safe_z_home]
# Nozzle position that puts the probe over the middle of the bed.
home_xy_position: 117.5, 135.5
speed: 200
z_hop: 8
z_hop_speed: 15

[bed_mesh]
speed: 250
horizontal_move_z: 3
# The probe can reach from 18 mm in front of the nozzle's range; these keep it on the bed.
mesh_min: 15, 10
mesh_max: 220, 215
probe_count: 7, 7
algorithm: bicubic
fade_start: 0.6
fade_end: 10
# BED_MESH_CALIBRATE ADAPTIVE=1 only probes where the print goes (START_PRINT does this)
adaptive_margin: 5

[screws_tilt_adjust]
# Probe positions over the four bed screws (nozzle coordinates, so the probe is on the screw).
# >>> CHECK: if a point lands beside a screw, nudge it here.
screw1: 30, 48
screw1_name: front left
screw2: 200, 48
screw2_name: front right
screw3: 200, 218
screw3_name: back right
screw4: 30, 218
screw4_name: back left
horizontal_move_z: 8
speed: 200
screw_thread: CW-M4

[axis_twist_compensation]
# Fixes the probe reading differently across X when the gantry twists. Run
# AXIS_TWIST_COMPENSATION_CALIBRATE once after PROBE_CALIBRATE if the first layer is uneven
# left to right even with a mesh.
calibrate_start_x: 20
calibrate_end_x: 210
calibrate_y: 135

#####################################################################
#  Vibration compensation (Klipper's input shaper)
#####################################################################

[input_shaper]
# Measured by SHAPER_CALIBRATE with the ADXL345 (INPUT_SHAPER_AUTO does it all), then saved
# by SAVE_CONFIG at the bottom of this file. Until then these are typical Ender CoreXY values.
shaper_type_x: mzv
shaper_freq_x: 50
shaper_type_y: mzv
shaper_freq_y: 40

#####################################################################
#  Everything the UI and slicer use
#####################################################################

[exclude_object]     # cancel one object mid-print (the UI and OctoPrint's Cancel Objects use it)
[gcode_arcs]         # G2/G3 from Arc Welder or the slicer
resolution: 0.1
[respond]            # lets macros talk to the UI (dialogs, messages)
[pause_resume]
recover_velocity: 100
[display_status]     # M117 messages and progress for the UI
[force_move]         # DIRECTION_TEST moves without homing (first power-on only)
enable_force_move: True
[skew_correction]    # optional: see README "Skew"

[idle_timeout]
gcode:
  {% if printer.pause_resume.is_paused %}
    M104 S0                       ; paused and idle: cool the nozzle, keep the bed warm
    RESPOND MSG="Idle while paused: nozzle heater off. RESUME reheats it."
  {% else %}
    TURN_OFF_HEATERS
    M84
  {% endif %}
timeout: 1800

# Calibration results are written below by SAVE_CONFIG. Leave this block at the end.
