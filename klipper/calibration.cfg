# MakerPrint E3NG calibration macros. Run them in this order the first time:
#
#   1. DIRECTION_TEST      motors turn the right way (do this before homing!)
#   2. Z_CHECK             Z moves the distance it says
#   3. PID_HOTEND / PID_BED
#   4. PROBE_CHECK         the BLTouch repeats
#   5. PROBE_Z_OFFSET      the paper test (the Volcano's longer nozzle makes this essential)
#   6. BED_SCREWS          level the four screws by hand
#   7. EXTRUDER_CALIBRATE  then EXTRUDER_RESULT
#   8. INPUT_SHAPER_AUTO   vibration compensation with the ADXL345
#                          (or RINGING_TOWER for the manual method)
#   9. PA_CALIBRATE        pressure advance (print klipper/prints/square_tower.stl)
#  10. SPEED_TEST          find how fast the motors can go without skipping
#
# Or run CALIBRATION_WIZARD and press the buttons: the UI shows each step as a dialog.

#####################################################################
#  The wizard
#####################################################################

[gcode_macro CALIBRATION_WIZARD]
description: Every calibration step as buttons in a dialog
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Calibrate the E3NG"
  RESPOND TYPE=command MSG="action:prompt_text Go top to bottom the first time. Each button runs one step; the results show in the terminal and on the Tune page."
  RESPOND TYPE=command MSG="action:prompt_button 1. Motor directions|DIRECTION_TEST|secondary"
  RESPOND TYPE=command MSG="action:prompt_button 2. Z distance|Z_CHECK|secondary"
  RESPOND TYPE=command MSG="action:prompt_button 3. PID hotend (220°)|PID_HOTEND|secondary"
  RESPOND TYPE=command MSG="action:prompt_button 4. PID bed (60°)|PID_BED|secondary"
  RESPOND TYPE=command MSG="action:prompt_button 5. Probe repeatability|PROBE_CHECK|secondary"
  RESPOND TYPE=command MSG="action:prompt_button 6. Z offset (paper test)|PROBE_Z_OFFSET|primary"
  RESPOND TYPE=command MSG="action:prompt_button 7. Bed screws|BED_SCREWS|secondary"
  RESPOND TYPE=command MSG="action:prompt_button 8. Extruder steps|EXTRUDER_CALIBRATE|secondary"
  RESPOND TYPE=command MSG="action:prompt_button 9. Input shaper (ADXL345)|INPUT_SHAPER_AUTO|primary"
  RESPOND TYPE=command MSG="action:prompt_button 10. Speed test|SPEED_TEST|warning"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_PROMPT_CLOSE|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Save config|SAVE_CONFIG|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _PROMPT_CLOSE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro _HOME_IF_NEEDED]
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

#####################################################################
#  1-2. Mechanics
#####################################################################

[gcode_macro DIRECTION_TEST]
description: First power-on check. Put the head in the middle and the bed halfway down first.
gcode:
  {% set step = params.STEP|default(0)|int %}
  {% if step == 0 %}
    RESPOND TYPE=command MSG="action:prompt_begin Motor direction test"
    RESPOND TYPE=command MSG="action:prompt_text Move the head to the middle of the bed by hand and lower the bed a few cm. Each button moves 10 mm without homing. Watch which way it goes; keep a hand on the power switch."
    RESPOND TYPE=command MSG="action:prompt_button Move X +10 (should go RIGHT)|DIRECTION_TEST STEP=1|primary"
    RESPOND TYPE=command MSG="action:prompt_button Move Y +10 (should go BACK)|DIRECTION_TEST STEP=2|primary"
    RESPOND TYPE=command MSG="action:prompt_button Move Z +10 (nozzle and bed APART)|DIRECTION_TEST STEP=3|primary"
    RESPOND TYPE=command MSG="action:prompt_button Check endstops|QUERY_ENDSTOPS|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Done|DIRECTION_TEST STEP=9|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 9 %}
    M84
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="CoreXY fixes: X+ went LEFT -> invert both dir_pins. X+ went BACK -> invert stepper_y dir_pin. X+ went FRONT -> invert stepper_x dir_pin. X right but Y+ went FRONT -> swap the X and Y motor plugs. Diagonal -> one motor isn't moving, check its cable. Z wrong -> invert stepper_z dir_pin."
  {% else %}
    SET_KINEMATIC_POSITION X=117 Y=117 Z=100
    G91
    {% if step == 1 %}G1 X10 F1200{% elif step == 2 %}G1 Y10 F1200{% else %}G1 Z10 F300{% endif %}
    G90
  {% endif %}

[gcode_macro Z_CHECK]
description: Moves Z up exactly 20 mm. Measure it: 20 mm means the gear ratio is right.
gcode:
  _HOME_IF_NEEDED
  G90
  G1 Z10 F600
  M400
  RESPOND MSG="Z is at 10. Put a ruler or calipers on the gantry/bed now; in 5 seconds Z moves up 20 mm."
  G4 P5000
  G1 Z30 F600
  M400
  RESPOND MSG="Z moved 20 mm. ~9.5 mm means delete gear_ratio in [stepper_z]; ~42 mm means add gear_ratio: 42:20."

#####################################################################
#  3. Heaters
#####################################################################

[gcode_macro PID_HOTEND]
description: PID-tune the Volcano at TEMP (default 220) with the part fan at 25%
gcode:
  {% set t = params.TEMP|default(220)|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  _HOME_IF_NEEDED
  G90
  G1 Z10 F600
  M106 S64
  PID_CALIBRATE HEATER=extruder TARGET={t}
  M107
  RESPOND MSG="Done. Press Save config (or send SAVE_CONFIG) to keep the new PID values."

[gcode_macro PID_BED]
description: PID-tune the bed at TEMP (default 60)
gcode:
  {% set t = params.TEMP|default(60)|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  PID_CALIBRATE HEATER=heater_bed TARGET={t}
  RESPOND MSG="Done. Press Save config (or send SAVE_CONFIG) to keep the new PID values."

#####################################################################
#  4-7. Probe and bed
#####################################################################

[gcode_macro PROBE_CHECK]
description: Probe the middle of the bed 10 times; range should be under 0.02 mm
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  _HOME_IF_NEEDED
  G90
  G1 Z10 F600
  G1 X117.5 Y135.5 F12000
  PROBE_ACCURACY SAMPLES=10

[gcode_macro PROBE_Z_OFFSET]
description: Paper test at printing temperature, so the Volcano's expansion is included
gcode:
  {% set bed = params.BED|default(60)|int %}
  {% set hotend = params.EXTRUDER|default(150)|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  M140 S{bed}
  M104 S{hotend}
  G28
  M190 S{bed}
  M109 S{hotend}
  BED_MESH_CLEAR
  G1 X117.5 Y135.5 Z10 F12000
  PROBE_CALIBRATE
  RESPOND TYPE=command MSG="action:prompt_begin Paper test"
  RESPOND TYPE=command MSG="action:prompt_text Slide a sheet of paper under the nozzle. Lower until it drags slightly, then Accept."
  RESPOND TYPE=command MSG="action:prompt_button -0.1|TESTZ Z=-0.1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button -0.025|TESTZ Z=-0.025|secondary"
  RESPOND TYPE=command MSG="action:prompt_button +0.025|TESTZ Z=+0.025|secondary"
  RESPOND TYPE=command MSG="action:prompt_button +0.1|TESTZ Z=+0.1|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Abort|_PAPER_DONE ACTION=ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Accept|_PAPER_DONE ACTION=ACCEPT|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _PAPER_DONE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if params.ACTION|default("ABORT") == "ACCEPT" %}
    ACCEPT
    RESPOND MSG="Z offset accepted. Press Save config to keep it."
  {% else %}
    ABORT
  {% endif %}
  TURN_OFF_HEATERS

[gcode_macro BED_SCREWS]
description: Probe over each bed screw and say how far to turn it
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  _HOME_IF_NEEDED
  SCREWS_TILT_CALCULATE

[gcode_macro MESH_FULL]
description: Heat the bed and save a full 7x7 mesh as the "default" profile
gcode:
  {% set bed = params.BED|default(60)|int %}
  M190 S{bed}
  _HOME_IF_NEEDED
  BED_MESH_CALIBRATE PROFILE=default
  RESPOND MSG="Mesh saved as 'default' (press Save config to keep it after a restart)."

#####################################################################
#  8. Extruder
#####################################################################

[gcode_macro EXTRUDER_CALIBRATE]
description: Step 1 of 2. Heats, then extrudes 100 mm slowly. Mark the filament 120 mm above the extruder first.
gcode:
  {% set t = params.TEMP|default(215)|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND MSG="Mark the filament 120 mm above the extruder's entry now. Heating to {t}..."
  M109 S{t}
  M83
  G1 E50 F60
  G1 E50 F60
  M400
  RESPOND MSG="Measure from the extruder entry to your mark, then send EXTRUDER_RESULT LEFT=<mm> (20 means perfect)."

[gcode_macro EXTRUDER_RESULT]
description: Step 2 of 2. LEFT=<mm from extruder to the mark>. Prints the corrected rotation_distance.
gcode:
  {% set left = params.LEFT|float %}
  {% set moved = 120 - left %}
  {% set old = printer.configfile.settings.extruder.rotation_distance|float %}
  {% set new = old * moved / 100 %}
  RESPOND MSG="Extruded {'%.1f' % moved} mm of 100. rotation_distance {'%.3f' % old} -> {'%.3f' % new}. Put the new value in [extruder] in printer.cfg and RESTART."

#####################################################################
#  9. Vibration compensation
#####################################################################

[gcode_macro INPUT_SHAPER_AUTO]
description: Measure both axes with the ADXL345 and pick the shapers (Bambu-style vibration compensation)
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  ACCELEROMETER_QUERY
  _HOME_IF_NEEDED
  MEASURE_AXES_NOISE
  SHAPER_CALIBRATE
  RESPOND MSG="Done. The Tune page shows the result. Press Save config to keep it."

[gcode_macro RINGING_TOWER]
description: Manual input shaping without an accelerometer. Start this, then print klipper/prints/ringing_tower.stl.
gcode:
  SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
  SET_PRESSURE_ADVANCE ADVANCE=0
  SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO=0
  TUNING_TOWER COMMAND=SET_VELOCITY_LIMIT PARAMETER=ACCEL START=1500 STEP_DELTA=500 STEP_HEIGHT=5
  RESPOND MSG="Ringing tower armed. Print ringing_tower.stl now (one wall, 0.2 mm layers, 80 mm/s). Afterwards RESTART to undo these settings."

#####################################################################
#  10. Pressure advance and speed
#####################################################################

[gcode_macro PA_CALIBRATE]
description: Pressure advance tower. Start this, then print klipper/prints/square_tower.stl.
gcode:
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
  TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.005
  RESPOND MSG="PA tower armed. Print square_tower.stl at 100 mm/s. Find the sharpest corner height H (mm): PA = H x 0.005. Put it in _MP's pa for that material."

[gcode_macro SPEED_TEST]
description: Fast moves, then re-home and compare. SPEED= ACCEL= ITERATIONS= BOUND=
gcode:
  {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|float %}
  {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|float %}
  {% set iterations = params.ITERATIONS|default(5)|int %}
  {% set bound = params.BOUND|default(25)|int %}
  {% set xmin = printer.toolhead.axis_minimum.x + bound %}
  {% set xmax = printer.toolhead.axis_maximum.x - bound %}
  {% set ymin = printer.toolhead.axis_minimum.y + bound %}
  {% set ymax = printer.toolhead.axis_maximum.y - bound %}
  RESPOND TYPE=command MSG="action:prompt_end"
  G28
  G90
  G1 Z10 F600
  G28 X Y
  M400
  RESPOND MSG="SPEED_TEST: before (note the mcu: stepper_x / stepper_y numbers)"
  GET_POSITION
  SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}
  {% for i in range(iterations) %}
    G1 X{xmin} Y{ymin} F{speed * 60}
    G1 X{xmax} Y{ymax} F{speed * 60}
    G1 X{xmin} Y{ymax} F{speed * 60}
    G1 X{xmax} Y{ymin} F{speed * 60}
    G1 X{xmin} Y{ymin} F{speed * 60}
    G1 X{xmax} Y{ymin} F{speed * 60}
    G1 X{xmax} Y{ymax} F{speed * 60}
    G1 X{xmin} Y{ymax} F{speed * 60}
  {% endfor %}
  _RESTORE_SPEED_LIMITS
  G28 X Y
  M400
  RESPOND MSG="SPEED_TEST: after. If stepper_x or stepper_y moved more than ~16 steps from 'before', {speed|int} mm/s at {accel|int} mm/s² skips. Lower it."
  GET_POSITION
