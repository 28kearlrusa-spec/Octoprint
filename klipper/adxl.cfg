# ADXL345 wired to the Raspberry Pi's SPI pins, for INPUT_SHAPER_AUTO.
#
# The Pi itself runs as a second Klipper MCU (klipper_mcu). klipper/install.sh sets that up
# and turns SPI on. Wiring (ADXL345 -> Pi header):
#   GND -> pin 6   3V3 -> pin 1   CS -> pin 24 (CE0)   SDO -> pin 21 (MISO)
#   SDA -> pin 19 (MOSI)   SCL -> pin 23 (SCLK)
#
# Mount the ADXL345 on the toolhead (the Stealthburner front, or a zip tie on the shroud),
# firmly: anything loose shows up as fake resonances. Unplug and comment out the include in
# printer.cfg when you're done tuning if you'd rather not have the cable on the toolhead.

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_bus: spidev0.0

[resonance_tester]
accel_chip: adxl345
probe_points:
    117.5, 117.5, 20
