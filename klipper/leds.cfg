# Stealthburner LEDs (optional). Not included until you wire them: then add
#   [include leds.cfg]
# to printer.cfg under the other includes, and turn on "Toolhead" in MakerPrint's
# Settings > Fans and lights (Klipper name: sb_leds).
#
# Wiring on the stock Creality 4.2.2 board: Klipper can't drive the Ender 3 V2's stock screen,
# so its 10-pin connector is free. Use:
#   pin 3  (PB10)  -> LED data in (DIN)
#   pin 10 (5V)    -> LED +5V
#   pin 9  (GND)   -> LED GND
# The Stealthburner has 3 LEDs (1 logo + 2 nozzle), well within what that 5V pin can supply.
# If the colours come out wrong, change color_order (some boards use RGB).

[neopixel sb_leds]
pin: PB10
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.2

# Status colours for the macros: logo is LED 1, the nozzle lights are LEDs 2-3.
[gcode_macro STATUS_READY]
description: Logo dim white, nozzle off
gcode:
  SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0.2 INDEX=1 TRANSMIT=0
  SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=2 TRANSMIT=0
  SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=3

[gcode_macro STATUS_HEATING]
description: Logo orange
gcode:
  SET_LED LED=sb_leds RED=1 GREEN=0.35 BLUE=0 WHITE=0 INDEX=1

[gcode_macro STATUS_PROBING]
description: Logo blue
gcode:
  SET_LED LED=sb_leds RED=0 GREEN=0.3 BLUE=1 WHITE=0 INDEX=1

[gcode_macro STATUS_PRINTING]
description: Logo green, nozzle bright white to light the print
gcode:
  SET_LED LED=sb_leds RED=0.3 GREEN=1 BLUE=0 WHITE=0 INDEX=1 TRANSMIT=0
  SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=2 TRANSMIT=0
  SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=3

[gcode_macro STATUS_OFF]
description: All LEDs off
gcode:
  SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0
